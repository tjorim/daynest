[project]
name = "daynest-backend"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "alembic==1.20.1",
    "anyio==4.16.0",
    "email-validator==2.3.0",
    "fastapi==0.162.0",
    "google-auth==2.62.1",
    "httpx==0.28.1",
    "icalendar==7.3.0",
    "fastmcp==4.1.6",
    "psycopg[binary]==3.3.7",
    "pydantic[email]==2.14.2",
    "pydantic-settings==2.16.2",
    "cryptography==50.0.2",
    "pyjwt==2.15.1",
    "python-dateutil==4.0.0",
    "pywebpush==2.5.0",
    "sentry-sdk[fastapi]==2.73.0",
    "limits==5.8.0",
    "sse-starlette==3.6.0",
    "sqlalchemy==2.1.8",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
    "ty==0.0.97",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py315"
line-length = 120

[tool.ruff.lint]
ignore = ["B008"]  # Depends/Query in FastAPI route defaults is intentional
per-file-ignores = { "__init__.py" = ["F401"] }
