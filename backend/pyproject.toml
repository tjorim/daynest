[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "daynest-backend"
# Packaging metadata only; the project runs from source (uv run / the Docker image) and is never
# installed as a distributable wheel. The release version lives in /VERSION.
version = "0.0.0"
description = "FastAPI backend for Daynest"
requires-python = ">=3.15"
dependencies = [
    "alembic==1.20.1",
    "anyio==4.16.0",
    "email-validator==2.4.0",
    "fastapi==0.164.0",
    "google-auth==2.62.2",
    "httpx==0.28.1",
    "icalendar==7.3.0",
    "fastmcp==4.2.5",
    "psycopg[binary]==3.3.9",
    "pydantic[email]==2.14.3",
    "pydantic-settings==2.16.3",
    "cryptography==50.0.2",
    "pyjwt==2.15.1",
    "python-dateutil==4.0.0",
    "pywebpush==2.5.0",
    "sentry-sdk[fastapi]==2.75.0",
    "limits==5.8.0",
    "sse-starlette==3.7.1",
    "sqlalchemy==2.1.9",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.6",
    "ty==0.0.109",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Third-party deprecations we cannot fix here; each entry is scoped to the emitting
# module. Drop an entry once its upstream release stops warning.
filterwarnings = [
  # fastmcp's py-key-value-aio protocol is checked by beartype without @runtime_checkable.
  "ignore:.*isn't explicitly decorated with @runtime_checkable:DeprecationWarning:beartype",
]

# Run with `uv run pytest --cov` (CI does). The floor sits just below the measured total (88.20%); raise it as tests
# are added and never lower it to land a change.
[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 88
skip_covered = true

[tool.ruff]
target-version = "py315"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",  # line length is enforced by `ruff format`
    "B008",  # Depends/Query in FastAPI route defaults is intentional
    "UP042",  # the (str, Enum) classes keep str()/format() output; StrEnum would change it
]
per-file-ignores = { "__init__.py" = ["F401"] }

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ty.environment]
python-version = "3.15"

# Applied migrations are history and are not edited to satisfy a type checker.
[tool.ty.src]
exclude = ["alembic"]
