[project]
name = "daynest-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic==1.18.5",
    "anyio==4.14.2",
    "email-validator==2.3.0",
    "fastapi==0.141.1",
    "google-auth==2.56.3",
    "httpx==0.28.1",
    "icalendar==7.2.2",
    "fastmcp==4.0.0b1",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "cryptography==50.0.0",
    "pyjwt==2.13.0",
    "python-dateutil==2.9.0.post0",
    "pywebpush==2.4.0",
    "sentry-sdk[fastapi]==2.66.1",
    "slowapi==0.1.10",
    "sse-starlette==3.4.8",
    "sqlalchemy==2.0.51",
    "uvicorn[standard]==0.52.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.2",
    "ty==0.0.69",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
ignore = ["B008"]  # Depends/Query in FastAPI route defaults is intentional
per-file-ignores = { "__init__.py" = ["F401"] }

[tool.uv]
# fastmcp is intentionally pinned to a prerelease (still pre-1.0 during its
# v4 beta cycle) and requires an exact matching prerelease of fastmcp-slim,
# a transitive dependency uv doesn't treat as "explicitly" prerelease the
# same way. That inconsistency breaks specifically in the
# `python_full_version >= '3.14'` resolution fork (this project's actual
# Docker runtime — see backend/Dockerfile) whenever fastmcp itself moves to
# a newer prerelease, which is exactly the update Dependabot needs to
# propose. A `constraint-dependencies` pin on fastmcp-slim here is
# redundant (fastmcp's own metadata already exact-pins it) and, worse, goes
# stale the moment fastmcp bumps, since Dependabot only updates the
# `dependencies` entry it's targeting — not this separate constraint —
# breaking resolution outright instead of surfacing as an update PR.
# Allowing prereleases project-wide removes the inconsistency instead.
prerelease = "allow"
