[project]
name = "daynest-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic==1.20.0",
    "anyio==4.15.1",
    "email-validator==2.3.0",
    "fastapi==0.142.2",
    "google-auth==2.60.0",
    "httpx==0.28.1",
    "icalendar==7.3.0",
    "fastmcp==4.0.10",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "cryptography==50.0.1",
    "pyjwt==2.15.1",
    "python-dateutil==2.9.0.post0",
    "pywebpush==2.5.0",
    "sentry-sdk[fastapi]==2.71.0",
    "slowapi==0.1.10",
    "sse-starlette==3.5.0",
    "sqlalchemy==2.1.1",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
    "ty==0.0.84",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
ignore = ["B008"]  # Depends/Query in FastAPI route defaults is intentional
per-file-ignores = { "__init__.py" = ["F401"] }
