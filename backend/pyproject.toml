[project]
name = "daynest-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic==1.18.5",
    "anyio==4.14.2",
    "email-validator==2.3.0",
    "fastapi==0.141.1",
    "google-auth==2.56.2",
    "httpx==0.28.1",
    "icalendar==7.2.2",
    "fastmcp==4.0.0b1",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "cryptography==50.0.0",
    "pyjwt==2.13.0",
    "python-dateutil==2.9.0.post0",
    "pywebpush==2.3.0",
    "sentry-sdk[fastapi]==2.66.1",
    "slowapi==0.1.10",
    "sse-starlette==3.4.8",
    "sqlalchemy==2.0.51",
    "uvicorn[standard]==0.52.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.1",
    "ty==0.0.66",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
ignore = ["B008"]  # Depends/Query in FastAPI route defaults is intentional
per-file-ignores = { "__init__.py" = ["F401"] }

[tool.uv]
constraint-dependencies = ["fastmcp-slim==4.0.0b1"]
