name: e2e

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install frontend dependencies
        run: corepack pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Install Playwright browser
        run: corepack pnpm exec playwright install --with-deps chromium
        working-directory: frontend

      # Self-contained: playwright.config.ts's webServer builds the app with
      # the MSW mock service worker baked in (no real backend, database, or
      # credentials needed) and starts already authenticated as a mock user.
      - name: Run Playwright tests
        run: corepack pnpm run test:e2e
        working-directory: frontend

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
