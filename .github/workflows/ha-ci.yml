name: ha-ci

on:
  pull_request:
    paths:
      - 'custom_components/**'
      - '.github/workflows/ha-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'custom_components/**'
      - '.github/workflows/ha-ci.yml'

concurrency:
  group: "ha-ci-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ha-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.2'

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.8.22'

      - name: Install dependencies
        working-directory: custom_components
        run: |
          uv sync --group test
          echo "VIRTUAL_ENV=${{ github.workspace }}/custom_components/.venv" >> "$GITHUB_ENV"
          echo "${{ github.workspace }}/custom_components/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint
        working-directory: custom_components
        run: ruff check daynest/ tests/

      - name: Run tests
        working-directory: custom_components
        run: pytest -q
