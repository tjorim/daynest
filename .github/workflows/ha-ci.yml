name: ha-ci

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ha-safety:
    # Python 3.14.2 has no setup-python build for Ubuntu 26.04.
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: custom_components/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      - name: Install dependencies
        working-directory: custom_components
        run: |
          uv sync --group test
          echo "VIRTUAL_ENV=${{ github.workspace }}/custom_components/.venv" >> "$GITHUB_ENV"
          echo "${{ github.workspace }}/custom_components/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint
        working-directory: custom_components
        run: ruff check daynest/ tests/

      - name: Format
        working-directory: custom_components
        run: ruff format --check daynest/ tests/

      - name: Run tests
        working-directory: custom_components
        run: pytest -q
