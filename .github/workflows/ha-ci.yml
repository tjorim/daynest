name: ha-ci

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ha-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.2'

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.8.22'

      - name: Install dependencies
        working-directory: custom_components
        run: |
          uv sync --group test
          echo "VIRTUAL_ENV=${{ github.workspace }}/custom_components/.venv" >> "$GITHUB_ENV"
          echo "${{ github.workspace }}/custom_components/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint
        working-directory: custom_components
        run: ruff check daynest/ tests/

      - name: Format
        working-directory: custom_components
        run: ruff format --check daynest/ tests/

      - name: Run tests
        working-directory: custom_components
        run: pytest -q
