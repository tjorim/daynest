name: Release

on:
  push:
    tags:
      - "v*"

# Read-only by default. Only `draft` writes (contents) and only `publish-library` gets an OIDC token.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Every tjorim/* repository releases with the same job graph; a repository leaves out what it does not
# have. Publishing is always manual: the last job only drafts the GitHub release.
#
#   validate         tag == VERSION == every versioned file == CHANGELOG        (all repositories)
#   *-checks         the tests that gate this repository's release                (repository specific)
#   publish-library  build and publish the Python client to PyPI, once per tag    (Daynest, Travel)
#   package-*        build release assets (HACS archive, Android APK)             (Daynest, Travel)
#   draft            changelog notes + assets become a draft GitHub release       (all repositories)

jobs:
  validate:
    name: Validate tag, versions and changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          package-manager-cache: false

      # The tag, VERSION, the package.json files, the HACS manifest version and its python-daynest pin,
      # python-daynest/pyproject.toml, its uv.lock and the CHANGELOG must agree (scripts/release.mjs;
      # configuration in release.config.json). Android derives versionName/versionCode from VERSION at
      # build time, so it cannot drift.
      - name: Validate tag, versions and changelog
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release.mjs check --tag "$TAG"

      - name: Read version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

  library-checks:
    name: Library checks
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-daynest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: python-daynest/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Lint
        run: uv run ruff check src tests

      - name: Format
        run: uv run ruff format --check src tests

      - name: Type-check
        run: uv run pyright src

      - name: Test
        run: uv run pytest -q

  publish-library:
    name: Publish python-daynest to PyPI
    needs: [validate, library-checks]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: python-daynest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: python-daynest/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      - name: Build
        run: uv build

      # python-daynest shares the app's CalVer, so every tag publishes a new version; a re-run of a tag whose
      # version is already on PyPI skips the upload instead of failing on a duplicate.
      - name: Check if this version is already on PyPI
        id: published
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/python-daynest/${VERSION}/json")
          if [[ "${STATUS}" == "200" ]]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "python-daynest ${VERSION} is already on PyPI; skipping publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to PyPI
        if: steps.published.outputs.already_published == 'false'
        run: uv publish --trusted-publishing always

  package-hacs:
    name: Build HACS archive
    needs: [validate, publish-library]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: dashboard/package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: dashboard/.node-version
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: pnpm install --frozen-lockfile

      - name: Build dashboard card
        working-directory: dashboard
        run: pnpm run build

      - name: Create HACS release archive
        working-directory: custom_components/daynest
        run: zip -r ../../daynest.zip .

      - name: Upload HACS archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-hacs
          path: daynest.zip
          if-no-files-found: error

  build-android:
    name: Build Android release APK
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Write local.properties
        id: local-properties
        working-directory: android
        env:
          ANDROID_API_BASE_URL: ${{ secrets.ANDROID_API_BASE_URL }}
        run: |
          if [[ -n "${ANDROID_API_BASE_URL}" ]]; then
            echo "release_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_API_BASE_URL is not set. Release APK will be skipped."
            echo "release_available=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "apiBaseUrlRelease=${ANDROID_API_BASE_URL:-https://release.placeholder.invalid/}"
          } >> local.properties

      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -n "${KEYSTORE_BASE64}" ]]; then
            KEYSTORE_PATH="${RUNNER_TEMP}/release.keystore"
            echo "${KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
            echo "keystore_path=${KEYSTORE_PATH}" >> "$GITHUB_OUTPUT"
            echo "signing_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KEYSTORE_BASE64 is not set. Release APK will be skipped."
            echo "signing_available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble release APK
        if: >
          steps.local-properties.outputs.release_available == 'true' &&
          steps.keystore.outputs.signing_available == 'true'
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          ANDROID_API_BASE_URL: ${{ secrets.ANDROID_API_BASE_URL }}
          ANDROID_CERTIFICATE_PIN_HOST: ${{ secrets.ANDROID_CERTIFICATE_PIN_HOST }}
          ANDROID_CERTIFICATE_PINS: ${{ secrets.ANDROID_CERTIFICATE_PINS }}
        run: ./gradlew :app:assembleRelease

      - name: Upload Android APK
        if: >
          steps.local-properties.outputs.release_available == 'true' &&
          steps.keystore.outputs.signing_available == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  draft:
    name: Create draft release
    needs: [validate, package-hacs, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          package-manager-cache: false

      - name: Extract release notes from the changelog
        run: node scripts/release.mjs notes > "$RUNNER_TEMP/release-notes.md"

      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: assets

      # Publishing stays manual. The APK is attached only when the signing secrets are configured.
      - name: Create draft release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          body_path: ${{ runner.temp }}/release-notes.md
          files: assets/*
          fail_on_unmatched_files: true
