name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version

      # The tag, VERSION, the package.json files, the HACS manifest version and the CHANGELOG
      # must agree (scripts/release.mjs; configuration in release.config.json). Android derives
      # versionName/versionCode from VERSION at build time, so it cannot drift. python-daynest
      # keeps its own SemVer (issue #673) and is checked separately below.
      - name: Validate tag, versions and changelog
        run: node scripts/release.mjs check --tag "$GITHUB_REF_NAME"

      - name: Read python-daynest/pyproject.toml version
        # python-daynest keeps its own independent SemVer version — it is
        # NOT expected to match the app's CalVer tag (see issue #673). This
        # just captures it for the requirements-pin cross-check below; the
        # lib job separately skips publishing if this version is already
        # on PyPI.
        run: |
          set -euo pipefail
          LIB_VERSION=$(grep -oP '^version\s*=\s*"\K[^"]+' python-daynest/pyproject.toml)
          echo "LIB_VERSION=${LIB_VERSION}" >> "$GITHUB_ENV"
          echo "✓ python-daynest/pyproject.toml: ${LIB_VERSION}"

      - name: Check manifest.json python-daynest requirements pin
        run: |
          set -euo pipefail
          FILE_VERSION=$(python3 -c "
          import json, re, sys
          d = json.load(open('custom_components/daynest/manifest.json'))
          reqs = d.get('requirements', [])
          m = next((re.match(r'python-daynest==(.+)', r) for r in reqs), None)
          if not m:
              print('::error::manifest.json requirements list has no python-daynest== pin')
              sys.exit(1)
          print(m.group(1))
          ")
          # Checked against python-daynest's own version, not the app tag —
          # the two are independently versioned (see issue #673).
          if [[ "${FILE_VERSION}" != "${LIB_VERSION}" ]]; then
            echo "::error::manifest.json python-daynest requirement pin '${FILE_VERSION}' does not match python-daynest/pyproject.toml's version '${LIB_VERSION}'"
            exit 1
          fi
          echo "✓ manifest.json requirements pin: python-daynest==${FILE_VERSION}"

      # android/app/build.gradle.kts versionName/versionCode are no longer
      # hand-maintained literals — both are computed from the root VERSION
      # file at build time (see versionCodeFor()), which is checked above,
      # so there's nothing left here that could independently drift.

  lib:
    name: Publish python-daynest to PyPI
    needs: [preflight]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: python-daynest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: python-daynest/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Lint
        run: uv run ruff check src tests

      - name: Format
        run: uv run ruff format --check src tests

      - name: Type-check
        run: uv run pyright src

      - name: Test
        run: uv run pytest -q

      - name: Build
        run: uv build

      - name: Check if this version is already on PyPI
        # python-daynest releases independently of the app (see issue #673),
        # so most app tags won't have bumped its version. Skip rather than
        # fail — `uv publish` would otherwise error on a duplicate version.
        id: check-published
        run: |
          set -euo pipefail
          LIB_VERSION=$(grep -oP '^version\s*=\s*"\K[^"]+' pyproject.toml)
          HTTP_STATUS=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/python-daynest/${LIB_VERSION}/json")
          if [[ "${HTTP_STATUS}" == "200" ]]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "python-daynest ${LIB_VERSION} is already on PyPI; skipping publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to PyPI
        if: steps.check-published.outputs.already_published == 'false'
        run: uv publish --trusted-publishing always

  hacs:
    name: Build HACS package
    needs: [lib]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: dashboard/package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: dashboard/.node-version
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: pnpm install --frozen-lockfile

      - name: Build dashboard card
        working-directory: dashboard
        run: pnpm run build

      - name: Create HACS release archive
        working-directory: custom_components/daynest
        run: zip -r ../../daynest.zip .

      - name: Upload HACS artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynest-hacs
          path: daynest.zip
          if-no-files-found: error

  android:
    name: Build Android release APK
    needs: [preflight]
    runs-on: ubuntu-latest
    outputs:
      apk_available: ${{ steps.keystore.outputs.signing_available || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Write local.properties
        id: local-properties
        working-directory: android
        env:
          ANDROID_API_BASE_URL: ${{ secrets.ANDROID_API_BASE_URL }}
        run: |
          if [[ -n "${ANDROID_API_BASE_URL}" ]]; then
            echo "release_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_API_BASE_URL is not set. Release APK will be skipped."
            echo "release_available=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "apiBaseUrlRelease=${ANDROID_API_BASE_URL:-https://release.placeholder.invalid/}"
          } >> local.properties

      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -n "${KEYSTORE_BASE64}" ]]; then
            KEYSTORE_PATH="${RUNNER_TEMP}/release.keystore"
            echo "${KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
            echo "keystore_path=${KEYSTORE_PATH}" >> "$GITHUB_OUTPUT"
            echo "signing_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KEYSTORE_BASE64 is not set. Release APK will be skipped."
            echo "signing_available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble release APK
        if: >
          steps.local-properties.outputs.release_available == 'true' &&
          steps.keystore.outputs.signing_available == 'true'
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          ANDROID_API_BASE_URL: ${{ secrets.ANDROID_API_BASE_URL }}
          ANDROID_CERTIFICATE_PIN_HOST: ${{ secrets.ANDROID_CERTIFICATE_PIN_HOST }}
          ANDROID_CERTIFICATE_PINS: ${{ secrets.ANDROID_CERTIFICATE_PINS }}
        run: ./gradlew :app:assembleRelease

      - name: Upload Android APK
        if: >
          steps.local-properties.outputs.release_available == 'true' &&
          steps.keystore.outputs.signing_available == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daynest-android-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [hacs, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version

      - name: Extract release notes from the changelog
        run: node scripts/release.mjs notes > "$RUNNER_TEMP/release-notes.md"

      - name: Download HACS artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: daynest-hacs

      - name: Download Android APK
        if: needs.android.outputs.apk_available == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: daynest-android-release
          path: android-apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          body_path: ${{ runner.temp }}/release-notes.md
          fail_on_unmatched_files: false
          files: |
            daynest.zip
            android-apk/*.apk
