name: backend-ci

on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend-safety:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Set up uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: '0.8.22'

      - name: Install backend dependencies
        run: uv sync --frozen --group dev

      - name: Lint backend
        run: uv run ruff check .

      - name: Format backend
        run: uv run ruff format --check .

      - name: Type-check backend
        run: uv run ty check .

      - name: Run backend tests
        run: PYTHONPATH=. uv run pytest -q

  migration-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: daynest
          POSTGRES_PASSWORD: daynest
          POSTGRES_DB: daynest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daynest -d daynest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://daynest:daynest@127.0.0.1:5432/daynest
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: daynest
      DB_USER: daynest
      DB_PASSWORD: daynest
      JWT_SECRET_KEY: ci-secret
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Set up uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: '0.8.22'

      - name: Install backend dependencies
        run: uv sync --frozen --no-dev

      - name: Apply migrations to head
        run: uv run alembic upgrade head

      - name: Verify growth module migration schema
        run: PYTHONPATH=. uv run python scripts/check_growth_migrations.py

      - name: Verify migrations are in sync with models
        run: uv run alembic check
