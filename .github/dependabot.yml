version: 2
updates:
  # Monitor npm dependencies for the main frontend app
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 20
    assignees:
      - "tjorim"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
      - "platform:frontend"
    versioning-strategy: "increase"
    # Include transitive dependencies (router internals, msw helpers, d3 modules, ...) so groups can collect them.
    allow:
      - dependency-type: all
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      vite:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
      # tailwindcss and its Vite plugin share one release train
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      # OXC toolchain: linter, formatter and parser
      oxc:
        patterns:
          - "oxlint"
          - "oxfmt"
          - "oxc-parser"
      # Inlang i18n packages
      i18n:
        patterns:
          - "@inlang/*"
      # oidc-client-ts is the engine react-oidc-context wraps
      oidc:
        patterns:
          - "oidc-client-ts"
          - "react-oidc-context"
      # Vitest and Testing Library
      # tinybench is vitest's benchmark runner; it is a transitive dependency
      testing:
        patterns:
          - "@testing-library/*"
          - "@vitest/*"
          - "vitest"
          - "tinybench"
      # Browser APIs the tests run against; separate projects from Vitest, so reviewed on their own
      test-env:
        patterns:
          - "happy-dom"
          - "fake-indexeddb"
      # msw's own stack: msw, its @msw/@mswjs packages, and the helpers and cookie/URL packages it ships with.
      # Generic utilities it reaches (yargs, wrap-ansi, type-fest, graphql, ...) stay ungrouped.
      msw:
        patterns:
          - "msw"
          - "@msw/*"
          - "@mswjs/*"
          - "@open-draft/until"
          - "@inquirer/*"
          - "tldts"
          - "tldts-core"
          - "tough-cookie"
          - "outvariant"
          - "rettime"
          - "headers-polyfill"
          - "until-async"
          - "is-node-process"
      # Playwright and the axe-core integration used by the e2e suite
      playwright:
        patterns:
          - "@playwright/*"
          - "@axe-core/*"
      # TanStack Query packages must share one @tanstack/query-core; duplicate copies break QueryClient types
      tanstack-query:
        patterns:
          - "@tanstack/react-query"
          - "@tanstack/react-query-devtools"
          - "@tanstack/query-persist-client-core"
      # TanStack Router with its internals; seroval is router-core's serializer
      tanstack-router:
        patterns:
          - "@tanstack/react-router"
          - "@tanstack/router-*"
          - "@tanstack/history"
          - "isbot"
          - "seroval"
          - "seroval-plugins"
      # TanStack Table adapter and core must update together or pipelines fail
      tanstack-table:
        patterns:
          - "@tanstack/react-table"
          - "@tanstack/table-core"
      # @tanstack/charts pulls in the d3-* modules (d3-scale, d3-brush, d3-zoom, ...) as runtime
      # dependencies; they release individually and must move with it. svelte stays ungrouped:
      # inlang and oxfmt also depend on it
      charts:
        patterns:
          - "@tanstack/charts"
          - "d3-*"
          - "@types/d3-*"
      # TypeScript and its runtime helpers
      typescript:
        patterns:
          - "typescript"
          - "tslib"
      # Base UI is the shipped runtime (@base-ui/react and its pinned @base-ui/utils);
      # its behaviour changes get their own PR
      base-ui:
        patterns:
          - "@base-ui/*"
      # Icon set kept in its own group so icon releases are reviewed separately
      lucide:
        patterns:
          - "lucide-react"
      canvas-confetti:
        patterns:
          - "canvas-confetti"
          - "@types/canvas-confetti"
      # Schedule-X calendar component and its plugins
      schedule-x:
        patterns:
          - "@schedule-x/*"
      dayjs:
        patterns:
          - "dayjs"

  # Monitor npm dependencies for the Lovelace card
  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 20
    assignees:
      - "tjorim"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
      - "platform:dashboard"
    versioning-strategy: "increase"
    groups:
      # TypeScript and its runtime helpers
      typescript:
        patterns:
          - "typescript"
          - "tslib"
      # Schedule-X calendar component and its plugins
      schedule-x:
        patterns:
          - "@schedule-x/*"

  # Monitor Android Gradle dependencies and wrapper versions
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 20
    assignees:
      - "tjorim"
    commit-message:
      prefix: "deps(android)"
      include: "scope"
    labels:
      - "dependencies"
      - "platform:android"
    groups:
      # AGP, Kotlin and KSP must match each other; a split update breaks the build
      android-build:
        patterns:
          - "com.android.*"
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp"

  # Monitor uv-managed Python dependencies for the backend API
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 20
    assignees:
      - "tjorim"
    commit-message:
      prefix: "deps(backend)"
      include: "scope"
    labels:
      - "dependencies"
      - "platform:backend"
      - "python"
    versioning-strategy: "increase"
    # Include transitive dependencies such as mcp and mcp-types in grouped updates.
    allow:
      - dependency-type: all
    groups:
      # fastmcp pulls in mcp and mcp-types; cyclopts is its CLI dependency. Keep them moving together
      fastmcp:
        patterns:
          - "fastmcp"
          - "fastmcp-slim"
          - "mcp"
          - "mcp-types"
          - "cyclopts"
      # Keep Pydantic, its validation core, and settings integration together
      pydantic:
        patterns:
          - "pydantic"
          - "pydantic-core"
          - "pydantic-settings"
      python-quality:
        patterns:
          - "ruff"
          - "ty"
          - "pytest"
          - "pytest-asyncio"
      # psycopg[binary] installs psycopg-binary; psycopg-pool etc. ship from the same project
      psycopg:
        patterns:
          - "psycopg*"
      # Alembic is built on SQLAlchemy
      sqlalchemy:
        patterns:
          - "sqlalchemy"
          - "alembic"
      # Token, OIDC and JOSE libraries are security-sensitive; review them together
      auth:
        patterns:
          - "authlib"
          - "joserfc"
          - "pyjwt"
          - "google-auth"
      # FastAPI request stack and its async/multipart dependencies
      fastapi-stack:
        patterns:
          - "fastapi"
          - "starlette"
          - "python-multipart"
          - "anyio"
      # markdown-it plugins are pinned against their core release
      markdown:
        patterns:
          - "markdown-it-py"
          - "mdit-py-plugins"

  # Monitor uv-managed Python dependencies for the Home Assistant custom component
  - package-ecosystem: "uv"
    directory: "/custom_components"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 20
    assignees:
      - "tjorim"
    commit-message:
      prefix: "deps(ha)"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
      - "platform:home-assistant"
    versioning-strategy: "increase"
    allow:
      - dependency-type: all
    groups:
      # Apple PyObjC bindings are released as one family
      pyobjc:
        patterns:
          - "pyobjc-*"
      # Windows WinRT bindings are released as one family
      winrt:
        patterns:
          - "winrt-*"
      async:
        patterns:
          - "anyio"

  # Monitor uv-managed Python dependencies for the python-daynest library
  - package-ecosystem: "uv"
    directory: "/python-daynest"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 20
    assignees:
      - "tjorim"
    commit-message:
      prefix: "deps(lib)"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
      - "platform:python-lib"
    versioning-strategy: "increase"
    allow:
      - dependency-type: all
    groups:
      python-dev:
        patterns:
          - "pytest*"
          - "ruff"
          - "pyright"
          - "nodeenv"

  # Monitor GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 20
    assignees:
      - "tjorim"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"

  # Monitor Docker images
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 20
    assignees:
      - "tjorim"
    commit-message:
      prefix: "deps(docker)"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"

  # Monitor Docker Compose files
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 20
    assignees:
      - "tjorim"
    commit-message:
      prefix: "deps(compose)"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
