version: 2
updates:
  # Monitor npm dependencies for the main frontend app
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 20
    assignees:
      - "tjorim"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
      - "platform:frontend"
    versioning-strategy: "increase"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      vite:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
      testing:
        patterns:
          - "@testing-library/*"
          - "@vitest/*"
          - "vitest"
          - "msw"
          - "happy-dom"
      oxc:
        patterns:
          - "oxlint"
          - "oxfmt"
          - "oxc-parser"
      i18n:
        patterns:
          - "@inlang/*"
      # oidc-client-ts is the engine react-oidc-context wraps
      oidc:
        patterns:
          - "oidc-client-ts"
          - "react-oidc-context"
      playwright:
        patterns:
          - "@playwright/*"
          - "@axe-core/playwright"
      d3:
        patterns:
          - "d3-shape"
          - "@types/d3-shape"
      canvas-confetti:
        patterns:
          - "canvas-confetti"
          - "@types/canvas-confetti"
      schedule-x:
        patterns:
          - "@schedule-x/*"
      dayjs:
        patterns:
          - "dayjs"
      # TanStack packages (router, query, form, table, charts) share a release train
      tanstack:
        patterns:
          - "@tanstack/*"
      # Base UI and shadcn tooling plus icons: changes here need ui:check validation
      ui:
        patterns:
          - "@base-ui/*"
          - "@shadcn/*"
          - "lucide-react"
      typescript:
        patterns:
          - "typescript"
          - "tslib"

  # Monitor npm dependencies for the Lovelace card
  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 20
    assignees:
      - "tjorim"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
      - "platform:dashboard"
    versioning-strategy: "increase"
    groups:
      schedule-x:
        patterns:
          - "@schedule-x/*"
      typescript:
        patterns:
          - "typescript"
          - "tslib"

  # Monitor Android Gradle dependencies and wrapper versions
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 20
    assignees:
      - "tjorim"
    commit-message:
      prefix: "deps(android)"
      include: "scope"
    labels:
      - "dependencies"
      - "platform:android"
    groups:
      # Android Gradle Plugin, KSP and Kotlin plugin move together
      gradle-plugins:
        patterns:
          - "com.android.*"
          - "com.google.devtools.ksp"
          - "org.jetbrains.kotlin.*"

  # Monitor uv-managed Python dependencies for the backend API
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 20
    assignees:
      - "tjorim"
    commit-message:
      prefix: "deps(backend)"
      include: "scope"
    labels:
      - "dependencies"
      - "platform:backend"
      - "python"
    versioning-strategy: "increase"
    # Include transitive dependencies such as mcp and mcp-types in grouped updates.
    allow:
      - dependency-type: all
    groups:
      # fastmcp pulls in mcp and mcp-types; keep them moving together
      fastmcp:
        patterns:
          - "fastmcp"
          - "fastmcp-slim"
          - "mcp"
          - "mcp-types"
      # Keep Pydantic, its validation core, and settings integration together
      pydantic:
        patterns:
          - "pydantic"
          - "pydantic-core"
          - "pydantic-settings"
      python-quality:
        patterns:
          - "ruff"
          - "ty"
          - "pytest"
      # Google/OIDC auth stack; cachetools is a transitive google-auth dependency
      auth:
        patterns:
          - "authlib"
          - "joserfc"
          - "google-auth"
          - "cachetools"
      # FastAPI request stack and its async/multipart dependencies
      fastapi-stack:
        patterns:
          - "fastapi"
          - "starlette"
          - "python-multipart"
          - "anyio"

  # Monitor uv-managed Python dependencies for the Home Assistant custom component
  - package-ecosystem: "uv"
    directory: "/custom_components"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 20
    assignees:
      - "tjorim"
    commit-message:
      prefix: "deps(ha)"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
      - "platform:home-assistant"
    versioning-strategy: "increase"
    allow:
      - dependency-type: all
    groups:
      # Apple PyObjC bindings are released as one family
      pyobjc:
        patterns:
          - "pyobjc-*"
      # Windows WinRT bindings are released as one family
      winrt:
        patterns:
          - "winrt-*"
      async:
        patterns:
          - "anyio"

  # Monitor uv-managed Python dependencies for the python-daynest library
  - package-ecosystem: "uv"
    directory: "/python-daynest"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 20
    assignees:
      - "tjorim"
    commit-message:
      prefix: "deps(lib)"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
      - "platform:python-lib"
    versioning-strategy: "increase"
    allow:
      - dependency-type: all
    groups:
      python-dev:
        patterns:
          - "pytest*"
          - "ruff"
          - "pyright"
          - "nodeenv"

  # Monitor GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 20
    assignees:
      - "tjorim"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # Listed first so CodeQL actions keep their own group
      codeql:
        patterns:
          - "github/codeql-action/*"
      actions:
        patterns:
          - "*"

  # Monitor Docker images
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 20
    assignees:
      - "tjorim"
    commit-message:
      prefix: "deps(docker)"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"

  # Monitor Docker Compose files
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 20
    assignees:
      - "tjorim"
    commit-message:
      prefix: "deps(compose)"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
